<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - TradeWise</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .password-page {
            min-height: 100vh;
            background: #f8fafc;
            padding: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .password-container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        
        .password-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .password-header i {
            font-size: 3rem;
            color: #2563eb;
            margin-bottom: 1rem;
        }
        
        .password-header h1 {
            font-size: 1.8rem;
            color: #1e293b;
            margin-bottom: 0.5rem;
        }
        
        .password-header p {
            color: #64748b;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #334155;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 0.875rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        
        .password-strength {
            margin-top: 0.5rem;
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            overflow: hidden;
        }
        
        .password-strength-bar {
            height: 100%;
            width: 0;
            transition: all 0.3s;
        }
        
        .password-strength-bar.weak { width: 33%; background: #ef4444; }
        .password-strength-bar.medium { width: 66%; background: #f59e0b; }
        .password-strength-bar.strong { width: 100%; background: #10b981; }
        
        .btn-save {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }
        
        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(37, 99, 235, 0.4);
        }
        
        .message {
            padding: 0.875rem;
            margin: 1rem 0;
            border-radius: 8px;
            display: none;
            text-align: center;
        }
        
        .message.success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
            display: block;
        }
        
        .message.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
            display: block;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #2563eb;
            text-decoration: none;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .password-requirements {
            background: #f0f9ff;
            border-left: 4px solid #0ea5e9;
            padding: 1rem;
            border-radius: 0 8px 8px 0;
            margin: 1rem 0;
            font-size: 0.9rem;
            color: #64748b;
        }
        
        .password-requirements ul {
            padding-left: 1.5rem;
            margin: 0.5rem 0;
        }
        
        .password-requirements li {
            margin: 0.25rem 0;
        }
    </style>
</head>
<body class="password-page">
    <div class="password-container">
        <a href="{{ url_for('dashboard') }}" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>
        
        <div class="password-header">
            <i class="fas fa-lock"></i>
            <h1>Change Password</h1>
            <p>Update your account password for better security</p>
        </div>
        
        <form id="passwordForm">
            <div class="form-group">
                <label><i class="fas fa-key"></i> Current Password</label>
                <input type="password" id="currentPassword" name="current_password" required>
            </div>
            
            <div class="password-requirements">
                <strong>New Password Requirements:</strong>
                <ul>
                    <li>At least 6 characters long</li>
                    <li>Include letters and numbers</li>
                    <li>Avoid common passwords</li>
                </ul>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-lock"></i> New Password</label>
                <input type="password" id="newPassword" name="new_password" required minlength="6" oninput="checkPasswordStrength(this.value)">
                <div class="password-strength">
                    <div id="passwordStrengthBar" class="password-strength-bar"></div>
                </div>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Confirm New Password</label>
                <input type="password" id="confirmPassword" name="confirm_password" required>
            </div>
            
            <div id="message" class="message"></div>
            
            <button type="submit" class="btn-save">
                <i class="fas fa-save"></i> Update Password
            </button>
        </form>
    </div>
    
    <script>
        // Password strength checker
        function checkPasswordStrength(password) {
            const bar = document.getElementById('passwordStrengthBar');
            if (password.length < 6) {
                bar.className = 'password-strength-bar';
            } else if (password.length < 10) {
                bar.className = 'password-strength-bar weak';
            } else if (password.length < 14) {
                bar.className = 'password-strength-bar medium';
            } else {
                bar.className = 'password-strength-bar strong';
            }
        }
        
        // Handle password change
        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageEl = document.getElementById('message');
            const btn = e.target.querySelector('.btn-save');
            
            // Validate passwords match
            if (newPassword !== confirmPassword) {
                messageEl.textContent = '❌ New passwords do not match!';
                messageEl.className = 'message error';
                return;
            }
            
            // Validate password strength
            if (newPassword.length < 6) {
                messageEl.textContent = '❌ Password must be at least 6 characters!';
                messageEl.className = 'message error';
                return;
            }
            
            // Loading state
            const originalBtnText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';
            btn.disabled = true;
            
            try {
                const res = await fetch('/api/profile/change_password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        current_password: currentPassword,
                        new_password: newPassword
                    })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    messageEl.textContent = '✅ Password updated successfully! Redirecting to login...';
                    messageEl.className = 'message success';
                    
                    // Clear form
                    e.target.reset();
                    document.getElementById('passwordStrengthBar').className = 'password-strength-bar';
                    
                    // Redirect to login after 2 seconds for security
                    setTimeout(() => {
                        window.location.href = '/login/user';
                    }, 2000);
                } else {
                    messageEl.textContent = '❌ ' + (data.error || 'Password change failed');
                    messageEl.className = 'message error';
                }
            } catch (error) {
                console.error('Password change error:', error);
                messageEl.textContent = '❌ Connection error. Please try again.';
                messageEl.className = 'message error';
            } finally {
                btn.innerHTML = originalBtnText;
                btn.disabled = false;
            }
        });
    </script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>

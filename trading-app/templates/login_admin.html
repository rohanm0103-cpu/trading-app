<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - TradeWise</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            overflow: hidden;
        }
        
        /* Video Background */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        
        .video-background video {
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }
        
        /* Dark Overlay */
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }
        
        /* Login Container */
        .login-container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        /* Close Button */
        .back-home {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 2.5rem;
            height: 2.5rem;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 3;
        }
        
        .back-home:hover {
            color: white;
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }
        
        .back-home i {
            font-size: 1.2rem;
        }

        .back-home span {
            display: block;
            margin-top: -0.1rem;
            font-size: 1.55rem;
            line-height: 1;
            font-weight: 400;
        }
        
        /* Login Card */
        .login-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        
        .login-header h1 {
            color: white;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }
        
        .login-header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95rem;
        }
        
        .login-icon {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .login-icon i {
            font-size: 2.5rem;
            color: white;
        }
        
        /* Form Styles */
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
        }
        
        .form-group label i {
            margin-right: 0.5rem;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .form-group input {
            width: 100%;
            padding: 1rem 1.25rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .form-group input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.1);
        }

        .password-field {
            position: relative;
        }

        .password-field input {
            padding-right: 3.5rem;
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 1rem;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            font-size: 1rem;
            padding: 0.25rem;
        }

        .password-toggle:hover {
            color: white;
        }
        
        /* Submit Button */
        .btn-login {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
            backdrop-filter: blur(10px);
        }
        
        .btn-login:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .btn-login i {
            margin-right: 0.5rem;
        }
        
        /* Message */
        .message {
            margin-top: 1rem;
            padding: 0.875rem;
            border-radius: 8px;
            text-align: center;
            display: none;
            font-size: 0.9rem;
        }
        
        .message.error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            display: block;
        }
        
        .message.success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
            display: block;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .login-card {
                padding: 2rem;
            }
            
            .back-home {
                top: 1rem;
                right: 1rem;
                font-size: 0.9rem;
            }
        }
        
        @media (max-width: 480px) {
            .login-card {
                padding: 1.5rem;
            }
            
            .login-header h1 {
                font-size: 1.5rem;
            }
        }

        body {
            background:
                radial-gradient(circle at center, rgba(0, 198, 255, 0.1), transparent 70%),
                radial-gradient(circle at 20% 20%, rgba(0, 198, 255, 0.2), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.2), transparent 50%),
                #050709;
        }

        .video-background {
            display: none;
        }

        .admin-flow-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .admin-flow-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .admin-flow-lines {
            position: absolute;
            inset: 0;
            opacity: 0.5;
        }

        .admin-flow-lines svg {
            width: 100%;
            height: 100%;
        }

        .admin-flow-lines path {
            fill: none;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-dasharray: 780;
            stroke-dashoffset: 780;
            animation: graphFlow 7s ease-in-out infinite;
        }

        .admin-flow-lines path:first-of-type {
            stroke: url(#adminFlowGradient);
        }

        .admin-flow-lines path:nth-of-type(2) {
            stroke: rgba(16, 185, 129, 0.45);
            animation-delay: 1.2s;
        }

        .admin-flow-lines path:nth-of-type(3) {
            stroke: rgba(245, 200, 66, 0.34);
            animation-delay: 2.4s;
        }

        .login-card {
            position: relative;
            overflow: hidden;
            border-radius: 28px;
            background: rgba(20, 25, 35, 0.66);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            box-shadow: 0 26px 70px rgba(0, 0, 0, 0.38), 0 0 50px rgba(0, 198, 255, 0.1);
        }

        .login-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(0, 198, 255, 0.12), transparent 44%),
                linear-gradient(315deg, rgba(168, 85, 247, 0.13), transparent 44%);
            pointer-events: none;
        }

        .login-card > * {
            position: relative;
            z-index: 1;
        }

        .login-card .back-home {
            position: absolute;
            top: 1rem;
            right: 1rem;
            left: auto;
            z-index: 3;
        }

        .login-icon {
            background: rgba(0, 198, 255, 0.13);
            border-color: rgba(0, 198, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 198, 255, 0.22);
        }

        .form-group input {
            border-radius: 14px;
        }

        .form-group input:focus {
            border-color: rgba(0, 198, 255, 0.72);
            box-shadow: 0 0 0 4px rgba(0, 198, 255, 0.12), 0 0 26px rgba(0, 198, 255, 0.14);
        }

        .btn-login {
            border-radius: 999px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .btn-login:hover {
            filter: brightness(1.08);
            box-shadow: 0 0 26px rgba(0, 198, 255, 0.62), 0 16px 34px rgba(0, 198, 255, 0.25);
        }

        @keyframes graphFlow {
            0% {
                stroke-dashoffset: 780;
                opacity: 0.2;
            }
            45% {
                opacity: 1;
            }
            100% {
                stroke-dashoffset: -780;
                opacity: 0.2;
            }
        }
    </style>
</head>
<body>
    <!-- Video Background -->
    <div class="video-background">
        <video autoplay muted loop playsinline>
            <!-- ✅ FIXED: Flask url_for + correct MIME type -->
            <source src="{{ url_for('static', filename='videos/admin.mp4') }}" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="video-overlay"></div>
    </div>

    <div class="admin-flow-layer" aria-hidden="true">
        <div class="admin-flow-grid"></div>
        <div class="admin-flow-lines">
            <svg viewBox="0 0 1200 700" preserveAspectRatio="none">
                <defs>
                    <linearGradient id="adminFlowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#00c6ff" />
                        <stop offset="100%" stop-color="#a855f7" />
                    </linearGradient>
                </defs>
                <path d="M0,500 C120,450 210,560 330,480 C460,390 560,230 700,280 C840,330 910,520 1040,470 C1120,440 1160,360 1200,390" />
                <path d="M0,580 C140,530 250,610 390,545 C520,485 610,320 760,360 C910,400 960,580 1100,535 C1150,520 1180,480 1200,500" />
                <path d="M0,420 C150,360 260,430 390,365 C520,300 610,150 760,205 C900,255 970,390 1100,345 C1155,326 1180,290 1200,305" />
            </svg>
        </div>
    </div>
    
    <!-- Login Container -->
    <div class="login-container">
        <!-- Login Card -->
        <div class="login-card">
            <!-- Close Button -->
            <a href="{{ url_for('index') }}" class="back-home" aria-label="Close and go to home page">
                <span aria-hidden="true">&times;</span>
            </a>

            <div class="login-header">
                <div class="login-icon">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h1>Admin Login</h1>
                <p>Enter your credentials to access the admin panel</p>
            </div>
            
            <form id="adminForm">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i>
                        Username
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Enter admin username" 
                        required 
                        autocomplete="username"
                    >
                </div>
                
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        Password
                    </label>
                    <div class="password-field">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Enter password" 
                            required 
                            autocomplete="current-password"
                        >
                        <button type="button" class="password-toggle" onclick="togglePassword('password', this)" aria-label="Show password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i>
                    Login as Admin
                </button>
            </form>
            
            <div id="message" class="message"></div>
        </div>
    </div>

    <script>
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const icon = button.querySelector('i');
            const showPassword = input.type === 'password';

            input.type = showPassword ? 'text' : 'password';
            icon.className = showPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
            button.setAttribute('aria-label', showPassword ? 'Hide password' : 'Show password');
        }

        // Form submission
        document.getElementById('adminForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageEl = document.getElementById('message');
            const btn = document.querySelector('.btn-login');
            
            // Show loading state
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
            btn.disabled = true;
            
            try {
                const res = await fetch('/api/login/admin', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    messageEl.textContent = 'Login successful! Redirecting...';
                    messageEl.className = 'message success';
                    
                    // Redirect to admin dashboard
                    setTimeout(() => {
                        window.location.href = '/admin/dashboard';
                    }, 1000);
                } else {
                    messageEl.textContent = data.error || 'Invalid credentials';
                    messageEl.className = 'message error';
                    
                    // Shake animation
                    const card = document.querySelector('.login-card');
                    card.style.animation = 'none';
                    setTimeout(() => {
                        card.style.animation = 'shake 0.5s';
                    }, 10);
                }
            } catch (error) {
                console.error('Login error:', error);
                messageEl.textContent = 'Connection error. Please try again.';
                messageEl.className = 'message error';
            } finally {
                // Reset button
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login as Admin';
                btn.disabled = false;
            }
        });
        
        // Add shake animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
                20%, 40%, 60%, 80% { transform: translateX(10px); }
            }
        `;
        document.head.appendChild(style);
        
        // Add enter key support
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    document.getElementById('adminForm').dispatchEvent(new Event('submit'));
                }
            });
        });
    </script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
